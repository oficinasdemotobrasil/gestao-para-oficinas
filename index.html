<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera a safe area; maximum-scale evita zoom acidental
         sem bloquear o zoom por gesto do usuário. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0B0C" />
    <!-- A descrição é o que aparece embaixo do link no Google e no WhatsApp.
         Vale uma frase de venda, e não o nome do produto repetido. -->
    <meta
      name="description"
      content="Orçamento, ordem de serviço, estoque e caixa da sua oficina de moto no celular. Teste 7 dias com tudo aberto, sem cartão."
    />
    <meta property="og:title" content="GIRO — a oficina de moto organizada no celular" />
    <meta
      property="og:description"
      content="Do orçamento ao dinheiro na conta. Teste 7 dias com tudo aberto, sem cartão."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Tela de início do iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GIRO" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Archivo 900 é a letra do logotipo, e só dele: a interface continua na
         fonte do próprio aparelho, que já está carregada e não custa rede.
         Se a fonte não chegar, o logotipo cai na fonte do sistema em peso
         máximo — fica diferente, não fica quebrado. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&display=swap"
    />

    <title>GIRO — sistema que organiza sua oficina de moto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
